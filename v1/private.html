<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SermoVideo - Private Call</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body {
  background:#121212; color:#fff; font-family:Arial, sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; margin:0;
}
h1 { font-size:2em; margin-bottom:1em; color:#00bfff; }
button {
  background:#00bfff; border:none; padding:12px 20px; margin:5px;
  border-radius:10px; color:#fff; font-weight:bold; cursor:pointer;
  transition:background 0.3s;
}
button:hover { background:#0099cc; }
input {
  padding:10px; border-radius:8px; border:none; outline:none;
  text-align:center; width:200px;
}
</style>
<!-- ✅ Use Firebase v8 scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <h1>SermoVideo</h1>
  <button id="createBtn">Create Private Call</button>
  <input id="roomIdInput" placeholder="Enter Room ID">
  <button id="joinBtn">Join Call</button>

<script>
// --- Firebase Config (replace with your own) ---
const firebaseConfig = {
   apiKey: "AIzaSyAbpd6uFQXYPD3Vfwkdq_ciS59na8xEAw0",
   authDomain: "sermovideo-link.firebaseapp.com",
   databaseURL: "https://sermovideo-link-default-rtdb.europe-west1.firebasedatabase.app",
   projectId: "sermovideo-link",
   storageBucket: "sermovideo-link.firebasestorage.app",
   messagingSenderId: "799514081881",
   appId: "1:799514081881:web:47990bdfef2c5460030f48",
   measurementId: "G-9HLVQ3B1QD"
};
firebase.initializeApp(firebaseConfig);

// --- Create or Join Room ---
document.getElementById('createBtn').onclick = () => {
  const roomId = Math.random().toString(36).substring(2, 8);
  window.location.href = `call.html?room=${roomId}`;
};
document.getElementById('joinBtn').onclick = () => {
  const roomId = document.getElementById('roomIdInput').value.trim();
  if(roomId) window.location.href = `call.html?room=${roomId}`;
};
</script>
</body>
</html>
