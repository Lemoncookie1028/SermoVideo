<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SermoVideo</title>
<style>
body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
h1 { color: #00bcd4; }
video { width: 45%; background: #000; margin: 10px; border-radius: 8px; }
.controls { margin: 15px; }
button { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; background: #00bcd4; color: white; cursor: pointer; }
button:hover { background: #0097a7; }
#status { margin-top: 10px; color: #ccc; }

.media-panel {
  margin: 20px auto;
  display: flex;
  justify-content: center;
  gap: 20px;
  background: #1e1e1e;
  padding: 12px 20px;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0,188,212,0.4);
  border: 1px solid #00bcd4;
  flex-wrap: wrap;
}

.media-control { display: flex; align-items: center; gap: 8px; }

.media-control label { color: #00bcd4; font-weight: bold; font-size: 14px; }

.media-control select {
  background: #121212;
  border: 1px solid #00bcd4;
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease-in-out;
}

.media-control select:hover {
  border-color: #0097a7;
  box-shadow: 0 0 6px #0097a7;
}

.call-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(18, 18, 18, 0.9);
  border: 1px solid #00bcd4;
  border-radius: 15px;
  padding: 10px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 0 15px rgba(0,188,212,0.4);
  z-index: 1000;
  opacity: 1;
  transition: opacity 0.5s ease;
}
.call-bar.hidden { opacity: 0; pointer-events: none; }

.arrow-toggle {
  background: #1e1e1e;
  border: 1px solid #00bcd4;
  color: #00bcd4;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}
.arrow-toggle:hover {
  background: #00bcd4;
  color: white;
  box-shadow: 0 0 6px rgba(0,188,212,0.6);
}

.call-controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
</style>
</head>
<body>
<h1>SermoVideo</h1>

<div class="media-panel">
  <div class="media-control">
    <label for="cameraSelect">🎥 Camera:</label>
    <select id="cameraSelect"></select>
  </div>
  <div class="media-control">
    <label for="micSelect">🎤 Microphone:</label>
    <select id="micSelect"></select>
  </div>
</div>

<div class="call-bar" id="callBar">
  <button class="arrow-toggle" id="toggleArrow">▼</button>
  <div class="call-controls">
    <button id="muteBtn">🔇 Mute</button>
    <button id="cameraBtn">📷 Pause Camera</button>
    <button id="skipBtn">⏭ Skip</button>
    <button id="toggleSearchBtn">🔄 Stop Searching</button>
  </div>
</div>

<div class="controls">
  <button id="startRandom">Start Random Chat</button>
  <div id="status">Not connected</div>
</div>

<video id="myVideo" autoplay muted playsinline></video>
<video id="partnerVideo" autoplay playsinline></video>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
// === Firebase Config ===
const firebaseConfig = {
   apiKey: "AIzaSyAbpd6uFQXYPD3Vfwkdq_ciS59na8xEAw0",
   authDomain: "sermovideo-link.firebaseapp.com",
   databaseURL: "https://sermovideo-link-default-rtdb.europe-west1.firebasedatabase.app",
   projectId: "sermovideo-link",
   storageBucket: "sermovideo-link.firebasestorage.app",
   messagingSenderId: "799514081881",
   appId: "1:799514081881:web:47990bdfef2c5460030f48"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let myStream;
let pc = null;
let localId = Math.random().toString(36).substring(2, 10);
let currentRoomRef = null;
let searching = false;

const myVideo = document.getElementById('myVideo');
const partnerVideo = document.getElementById('partnerVideo');
const statusDiv = document.getElementById('status');

function setStatus(text) { statusDiv.textContent = text; }

// --- Media ---
async function getDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoDevices = devices.filter(d => d.kind === "videoinput");
  const audioDevices = devices.filter(d => d.kind === "audioinput");

  const cameraSelect = document.getElementById("cameraSelect");
  const micSelect = document.getElementById("micSelect");

  cameraSelect.innerHTML = "";
  videoDevices.forEach((d, i) => { let opt = document.createElement("option"); opt.value=d.deviceId; opt.text=d.label||`Camera ${i+1}`; cameraSelect.appendChild(opt); });
  micSelect.innerHTML = "";
  audioDevices.forEach((d, i) => { let opt = document.createElement("option"); opt.value=d.deviceId; opt.text=d.label||`Microphone ${i+1}`; micSelect.appendChild(opt); });
}

async function startMedia(cameraId, micId) {
  if (myStream) myStream.getTracks().forEach(t => t.stop());
  myStream = await navigator.mediaDevices.getUserMedia({
    video: cameraId ? { deviceId: { exact: cameraId } } : true,
    audio: micId ? { deviceId: { exact: micId } } : true
  });
  myVideo.srcObject = myStream;
  if (pc) {
    myStream.getTracks().forEach(track => {
      const sender = pc.getSenders().find(s => s.track && s.track.kind === track.kind);
      if (sender) sender.replaceTrack(track);
    });
  }
}

document.getElementById("cameraSelect").addEventListener("change", () => startMedia(cameraSelect.value, micSelect.value));
document.getElementById("micSelect").addEventListener("change", () => startMedia(cameraSelect.value, micSelect.value));
getDevices().then(() => { startMedia(cameraSelect.value, micSelect.value); });

// --- Mute & Camera toggle ---
let micMuted=false, camPaused=false;
document.getElementById("muteBtn").onclick = () => {
  if(!myStream) return;
  micMuted = !micMuted;
  myStream.getAudioTracks().forEach(t=>t.enabled=!micMuted);
  document.getElementById("muteBtn").textContent = micMuted?"🔈 Unmute":"🔇 Mute";
};
document.getElementById("cameraBtn").onclick = () => {
  if(!myStream) return;
  camPaused = !camPaused;
  myStream.getVideoTracks().forEach(t=>t.enabled=!camPaused);
  document.getElementById("cameraBtn").textContent = camPaused?"📷 Resume Camera":"📷 Pause Camera";
};

// --- Call bar toggle ---
const callBar=document.getElementById('callBar');
const toggleArrow=document.getElementById('toggleArrow');
let hideTimeout;
function showCallBar(){ callBar.classList.remove('hidden'); clearTimeout(hideTimeout); hideTimeout=setTimeout(()=>callBar.classList.add('hidden'),3000);}
document.addEventListener('mousemove', showCallBar);
document.addEventListener('touchstart', showCallBar);
toggleArrow.addEventListener("click",()=>{
  if(callBar.classList.contains("hidden")){ callBar.classList.remove("hidden"); toggleArrow.textContent="▼"; }
  else{ callBar.classList.add("hidden"); toggleArrow.textContent="▲"; }
});
callBar.classList.add('hidden');

// --- WebRTC + Firebase signaling ---
async function createPeerConnection() {
  pc = new RTCPeerConnection({ iceServers:[{urls:'stun:stun.l.google.com:19302'}] });
  pc.ontrack = e => partnerVideo.srcObject = e.streams[0];
  myStream.getTracks().forEach(track=>pc.addTrack(track,myStream));
  pc.onicecandidate = e => {
    if(e.candidate && currentRoomRef) currentRoomRef.child('candidates/'+localId).push(JSON.stringify(e.candidate));
  };
}

async function startRandomChat() {
  if(!myStream || searching) return;
  searching=true;
  setStatus('Searching for a partner...');
  // Cleanup previous
  if(currentRoomRef){ currentRoomRef.remove(); currentRoomRef=null; }
  pc && pc.close();
  await createPeerConnection();

  const waitingRef = db.ref('sermovideo_waiting');
  const roomRef = db.ref('sermovideo_pairs');
  // Push self to waiting
  const myWaitingRef = waitingRef.push({id: localId});
  myWaitingRef.onDisconnect().remove();

  waitingRef.once('value').then(snapshot=>{
    const waitingData = snapshot.val()||{};
    const otherIds = Object.entries(waitingData).filter(([key,data])=>data.id!==localId);
    if(otherIds.length>0){
      const [otherKey,otherData] = otherIds[Math.floor(Math.random()*otherIds.length)];
      myWaitingRef.remove(); waitingRef.child(otherKey).remove();
      const roomKey = roomRef.push({user1:localId,user2:otherData.id}).key;
      currentRoomRef = roomRef.child(roomKey);
      setupRoom(currentRoomRef, true);
    } else {
      myWaitingRef.on('value', snap=>{
        if(!currentRoomRef){ /* still waiting */ }
      });
    }
  });
}

async function setupRoom(roomRef, isOfferer){
  roomRef.onDisconnect().remove();
  currentRoomRef=roomRef;

  if(isOfferer){
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await roomRef.child('offer').set(JSON.stringify(offer));
  } else {
    roomRef.child('offer').on('value', async snap=>{
      const offer = JSON.parse(snap.val());
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await roomRef.child('answer').set(JSON.stringify(answer));
    });
  }

  roomRef.child('answer').on('value', async snap=>{
    if(snap.exists() && isOfferer){
      const answer = JSON.parse(snap.val());
      await pc.setRemoteDescription(answer);
      setStatus('Connected!');
    }
  });

  roomRef.child('candidates').on('child_added', snap=>{
    snap.forEach(c=>pc.addIceCandidate(JSON.parse(c.val())));
  });
}

// --- Buttons ---
document.getElementById('startRandom').onclick = ()=>startRandomChat();
document.getElementById('skipBtn').onclick = ()=>{
  searching=false;
  pc && pc.close(); partnerVideo.srcObject=null;
  if(currentRoomRef){ currentRoomRef.remove(); currentRoomRef=null; }
  startRandomChat();
};
document.getElementById('toggleSearchBtn').onclick=()=>{
  searching=!searching;
  const btn=document.getElementById('toggleSearchBtn');
  btn.textContent=searching?"Stop Searching":"Start Searching";
  if(searching) startRandomChat();
  else { pc && pc.close(); partnerVideo.srcObject=null; if(currentRoomRef){ currentRoomRef.remove(); currentRoomRef=null; } setStatus('Searching paused'); }
};

window.addEventListener('beforeunload',()=>{
  if(currentRoomRef) currentRoomRef.remove();
});
</script>
</body>
</html>
