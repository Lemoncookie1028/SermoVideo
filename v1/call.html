<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SermoVideo - Call</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
body {
  background:#0d0d0d; color:#fff; font-family:Arial, sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100vh; margin:0;
}
h2 { color:#00bfff; margin-bottom:10px; }
video {
  width:45%; border-radius:12px; margin:10px;
  background:#000; box-shadow:0 0 15px #00bfff33;
}
div.controls {
  display:flex; gap:10px; margin-top:15px;
}
button {
  background:#00bfff; border:none; padding:10px 15px;
  border-radius:8px; color:#fff; font-weight:bold; cursor:pointer;
}
button:hover { background:#0099cc; }
</style>
<!-- ✅ Use Firebase v8 scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <h2>Private Room</h2>
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="controls">
    <button id="startBtn">Start Camera</button>
    <button id="callBtn">Call</button>
    <button id="hangupBtn">Hang Up</button>
  </div>

<script>
const firebaseConfig = {
   apiKey: "AIzaSyAbpd6uFQXYPD3Vfwkdq_ciS59na8xEAw0",
   authDomain: "sermovideo-link.firebaseapp.com",
   databaseURL: "https://sermovideo-link-default-rtdb.europe-west1.firebasedatabase.app",
   projectId: "sermovideo-link",
   storageBucket: "sermovideo-link.firebasestorage.app",
   messagingSenderId: "799514081881",
   appId: "1:799514081881:web:47990bdfef2c5460030f48",
   measurementId: "G-9HLVQ3B1QD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let peerConnection, localStream, remoteStream;
const roomId = new URLSearchParams(window.location.search).get("room");
const roomRef = db.collection("rooms").doc(roomId);

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

document.getElementById('startBtn').onclick = async () => {
  localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  localVideo.srcObject = localStream;
};

document.getElementById('callBtn').onclick = async () => {
  peerConnection = new RTCPeerConnection(configuration);
  remoteStream = new MediaStream();
  remoteVideo.srcObject = remoteStream;

  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  peerConnection.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

  const callerCandidates = roomRef.collection('callerCandidates');
  peerConnection.onicecandidate = e => e.candidate && callerCandidates.add(e.candidate.toJSON());

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  await roomRef.set({ offer });

  roomRef.onSnapshot(async snapshot => {
    const data = snapshot.data();
    if (!peerConnection.currentRemoteDescription && data?.answer) {
      const answerDesc = new RTCSessionDescription(data.answer);
      await peerConnection.setRemoteDescription(answerDesc);
    }
  });

  roomRef.collection('calleeCandidates').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
    });
  });
};

document.getElementById('hangupBtn').onclick = async () => {
  if (peerConnection) peerConnection.close();
  localStream.getTracks().forEach(t => t.stop());
  window.location.href = "private.html";
};

// --- If joining existing room ---
(async () => {
  const roomSnapshot = await roomRef.get();
  if (roomSnapshot.exists && !roomSnapshot.data().answer) {
    peerConnection = new RTCPeerConnection(configuration);
    remoteStream = new MediaStream();
    remoteVideo.srcObject = remoteStream;

    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    localVideo.srcObject = localStream;
    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

    const calleeCandidates = roomRef.collection('calleeCandidates');
    peerConnection.onicecandidate = e => e.candidate && calleeCandidates.add(e.candidate.toJSON());
    peerConnection.ontrack = e => e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));

    const offer = roomSnapshot.data().offer;
    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);
    await roomRef.update({ answer });

    roomRef.collection('callerCandidates').onSnapshot(snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      });
    });
  }
})();
</script>
</body>
</html>
