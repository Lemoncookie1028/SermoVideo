<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SermoVideo</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #00c3ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  p {
    font-size: 1.1rem;
    color: #ccc;
    margin-bottom: 40px;
  }
  button {
    background: linear-gradient(90deg, #00c3ff, #7b2ff7);
    border: none;
    padding: 14px 28px;
    color: white;
    font-size: 1.1rem;
    border-radius: 12px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
  }
  button:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }
  #authBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #222;
    border: 1px solid #333;
  }
</style>
</head>
<body>
  <button id="authBtn">Sign In</button>
  <h1>SermoVideo</h1>
  <p>Connect instantly with private or random video calls.</p>
  <p>random calling is currently unavailable</p> 
  <div>
    <button onclick="window.location.href='private.html'">🎥 Start Private Call</button>
    <button onclick="window.location.href='random.html'">🔄 Join Random Chat </button>
  </div>

  <script type="module">
    // Firebase imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const authBtn = document.getElementById('authBtn');

    authBtn.addEventListener('click', async () => {
      if (auth.currentUser) {
        await signOut(auth);
      } else {
        await signInWithPopup(auth, provider);
      }
    });

    onAuthStateChanged(auth, user => {
      if (user) {
        authBtn.textContent = `Sign Out (${user.displayName.split(" ")[0]})`;
      } else {
        authBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
