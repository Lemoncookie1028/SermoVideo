<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SermoVideo</title>
<style>
body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
h1 { color: #00bcd4; }
video { width: 45%; background: #000; margin: 10px; border-radius: 8px; }
.controls { margin: 15px; }
button { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; background: #00bcd4; color: white; cursor: pointer; }
button:hover { background: #0097a7; }
#status { margin-top: 10px; color: #ccc; }

.media-panel {
  margin: 20px auto;
  display: flex;
  justify-content: center;
  gap: 20px;
  background: #1e1e1e;
  padding: 12px 20px;
  border-radius: 14px;
  box-shadow: 0 0 12px rgba(0,188,212,0.4);
  border: 1px solid #00bcd4;
  flex-wrap: wrap;
}

.media-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.media-control label {
  color: #00bcd4;
  font-weight: bold;
  font-size: 14px;
}

.media-control select {
  background: #121212;
  border: 1px solid #00bcd4;
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease-in-out;
}

.media-control select:hover {
  border-color: #0097a7;
  box-shadow: 0 0 6px #0097a7;
}

/* Call bar with arrow toggle */
.call-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(18, 18, 18, 0.9);
  border: 1px solid #00bcd4;
  border-radius: 15px;
  padding: 10px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  box-shadow: 0 0 15px rgba(0,188,212,0.4);
  z-index: 1000;
  opacity: 1;
  transition: opacity 0.5s ease;
}
.call-bar.hidden {
  opacity: 0;
  pointer-events: none;
}

.arrow-toggle {
  background: #1e1e1e;
  border: 1px solid #00bcd4;
  color: #00bcd4;
  font-size: 16px;
  padding: 4px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease-in-out;
}
.arrow-toggle:hover {
  background: #00bcd4;
  color: white;
  box-shadow: 0 0 6px rgba(0,188,212,0.6);
}

.call-controls {
  display: flex;
  gap: 15px;
  justify-content: center;
  align-items: center;
}
</style>
</head>
<body>
<h1>SermoVideo</h1>

<div class="media-panel">
  <div class="media-control">
    <label for="cameraSelect">🎥 Camera:</label>
    <select id="cameraSelect"></select>
  </div>
  <div class="media-control">
    <label for="micSelect">🎤 Microphone:</label>
    <select id="micSelect"></select>
  </div>
</div>

<div class="call-bar" id="callBar">
  <button class="arrow-toggle" id="toggleArrow">▼</button>
  <div class="call-controls">
    <button id="muteBtn">🔇 Mute</button>
    <button id="cameraBtn">📷 Pause Camera</button>
    <button id="skipBtn">⏭ Skip</button>
    <button id="toggleSearchBtn">🔄 Stop Searching</button>
  </div>
</div>

<div class="controls">
  <button id="startRandom">Start Random Chat</button>
  <div id="status">Not connected</div>
</div>

<video id="myVideo" autoplay muted playsinline></video>
<video id="partnerVideo" autoplay playsinline></video>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
// === Firebase Config ===
const firebaseConfig = {
   apiKey: "AIzaSyAbpd6uFQXYPD3Vfwkdq_ciS59na8xEAw0",
   authDomain: "sermovideo-link.firebaseapp.com",
   databaseURL: "https://sermovideo-link-default-rtdb.europe-west1.firebasedatabase.app",
   projectId: "sermovideo-link",
   storageBucket: "sermovideo-link.firebasestorage.app",
   messagingSenderId: "799514081881",
   appId: "1:799514081881:web:47990bdfef2c5460030f48",
   measurementId: "G-9HLVQ3B1QD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// === PeerJS Setup ===
const peer = new Peer();
const myVideo = document.getElementById('myVideo');
const partnerVideo = document.getElementById('partnerVideo');
let myStream;
let currentCall = null;
let myWaitingRef = null;
let searching = false;
const waitingRef = db.ref('sermovideo_waiting');
const pairRef = db.ref('sermovideo_pairs');
const statusDiv = document.getElementById('status');

let pairListener = null;

function setStatus(text) { statusDiv.textContent = text; }

// Get camera & mic
navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
  myStream = stream;
  myVideo.srcObject = stream;
});

// Handle incoming calls
peer.on('call', call => {
  cleanupCall();
  currentCall = call;
  call.answer(myStream);
  call.on('stream', remoteStream => {
    partnerVideo.srcObject = remoteStream;
    setStatus('Connected!');
  });
  call.on('close', () => {
    cleanupCall();
    if (searching) startRandomChat();
  });
});

function cleanupCall() {
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }
  partnerVideo.srcObject = null;
}

function cleanupWaiting() {
  if (myWaitingRef) {
    myWaitingRef.remove();
    myWaitingRef = null;
  }
  if (pairListener) {
    pairRef.off('child_added', pairListener);
    pairListener = null;
  }
}

// Random chat
function startRandomChat() {
  if (!myStream || !searching) return;
  setStatus('Searching for a partner...');
  cleanupWaiting();

  myWaitingRef = waitingRef.push(peer.id);

  waitingRef.once('value').then(snapshot => {
    if (!searching) return;
    const waitingData = snapshot.val() || {};
    const waitingIds = Object.values(waitingData).filter(id => id !== peer.id);

    if (waitingIds.length > 0) {
      const partnerId = waitingIds[Math.floor(Math.random() * waitingIds.length)];
      Object.entries(waitingData).forEach(([key, id]) => {
        if (id === peer.id || id === partnerId) waitingRef.child(key).remove();
      });
      const roomId = peer.id + '_' + partnerId;
      pairRef.child(roomId).set({ user1: peer.id, user2: partnerId });

      cleanupCall();
      currentCall = peer.call(partnerId, myStream);
      currentCall.on('stream', remoteStream => {
        partnerVideo.srcObject = remoteStream;
        setStatus('Connected!');
      });
      currentCall.on('close', () => {
        cleanupCall();
        if (searching) startRandomChat();
      });

    } else {
      pairListener = pairRef.on('child_added', snapshot => {
        const data = snapshot.val();
        if (data.user2 === peer.id && !currentCall && searching) {
          cleanupCall();
          currentCall = peer.call(data.user1, myStream);
          currentCall.on('stream', remoteStream => {
            partnerVideo.srcObject = remoteStream;
            setStatus('Connected!');
          });
          currentCall.on('close', () => {
            cleanupCall();
            if (searching) startRandomChat();
          });
        }
      });
    }
  });
}

// Buttons
document.getElementById('skipBtn').onclick = () => {
  cleanupCall();
  if (searching) startRandomChat();
};
document.getElementById('toggleSearchBtn').onclick = () => {
  searching = !searching;
  const btn = document.getElementById('toggleSearchBtn');
  btn.textContent = searching ? 'Stop Searching' : 'Start Searching';
  if (searching) startRandomChat();
  else {
    setStatus('Searching paused');
    cleanupWaiting();
    cleanupCall();
  }
};
document.getElementById('startRandom').onclick = () => {
  searching = true;
  document.getElementById('toggleSearchBtn').textContent = 'Stop Searching';
  startRandomChat();
};

// Devices
const cameraSelect = document.getElementById("cameraSelect");
const micSelect = document.getElementById("micSelect");

async function getDevices() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoDevices = devices.filter(d => d.kind === "videoinput");
  const audioDevices = devices.filter(d => d.kind === "audioinput");

  cameraSelect.innerHTML = "";
  videoDevices.forEach((device, index) => {
    const option = document.createElement("option");
    option.value = device.deviceId;
    option.text = device.label || `Camera ${index + 1}`;
    cameraSelect.appendChild(option);
  });

  micSelect.innerHTML = "";
  audioDevices.forEach((device, index) => {
    const option = document.createElement("option");
    option.value = device.deviceId;
    option.text = device.label || `Microphone ${index + 1}`;
    micSelect.appendChild(option);
  });
}

async function startMedia(cameraId, micId) {
  if (myStream) myStream.getTracks().forEach(track => track.stop());

  myStream = await navigator.mediaDevices.getUserMedia({
    video: cameraId ? { deviceId: { exact: cameraId } } : true,
    audio: micId ? { deviceId: { exact: micId } } : true
  });
  myVideo.srcObject = myStream;

  if (currentCall) {
    myStream.getTracks().forEach(track => {
      const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === track.kind);
      if (sender) sender.replaceTrack(track);
    });
  }
}

cameraSelect.addEventListener("change", () => startMedia(cameraSelect.value, micSelect.value));
micSelect.addEventListener("change", () => startMedia(cameraSelect.value, micSelect.value));
getDevices().then(() => {
  if (cameraSelect.options.length > 0 || micSelect.options.length > 0) {
    startMedia(cameraSelect.value, micSelect.value);
  }
});

// Mute & camera toggle
const muteBtn = document.getElementById("muteBtn");
const cameraBtn = document.getElementById("cameraBtn");
let micMuted = false;
let camPaused = false;

muteBtn.addEventListener("click", () => {
  if (!myStream) return;
  micMuted = !micMuted;
  myStream.getAudioTracks().forEach(track => (track.enabled = !micMuted));
  muteBtn.textContent = micMuted ? "🔈 Unmute" : "🔇 Mute";
});

cameraBtn.addEventListener("click", () => {
  if (!myStream) return;
  camPaused = !camPaused;
  myStream.getVideoTracks().forEach(track => (track.enabled = !camPaused));
  cameraBtn.textContent = camPaused ? "📷 Resume Camera" : "📷 Pause Camera";
});

// Call bar toggle
const callBar = document.getElementById('callBar');
const toggleArrow = document.getElementById('toggleArrow');
let hideTimeout;

function showCallBar() {
  callBar.classList.remove('hidden');
  clearTimeout(hideTimeout);
  hideTimeout = setTimeout(() => {
    callBar.classList.add('hidden');
  }, 3000);
}
document.addEventListener('mousemove', showCallBar);
document.addEventListener('touchstart', showCallBar);

toggleArrow.addEventListener("click", () => {
  const isHidden = callBar.classList.contains("hidden");
  if (isHidden) {
    callBar.classList.remove("hidden");
    toggleArrow.textContent = "▼";
  } else {
    callBar.classList.add("hidden");
    toggleArrow.textContent = "▲";
  }
});

callBar.classList.add('hidden');
</script>
</body>
</html>
